[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
navigation = "2.10.2"
recyclerview = "1.4.0"
documentfile = "1.1.0"
flexbox = "3.0.0"
media3 = "1.11.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
recyclerview = {group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview"}
documentfile = {group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile"}
flexbox = {group = "com.google.android.flexbox", name = "flexbox", version.ref = "flexbox"}
media3-exoplayer = {group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3"}
media3-ui = {group = "androidx.media3", name = "media3-ui", version.ref = "media3"}
media3-exoplayer-hls = {group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3"}
media3-ui-compose = {group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3"}
media3-ui-compose-material3 = {group = "androidx.media3", name = "media3-ui-compose-material3", version.ref = "media3"}
media3-session = {group = "androidx.media3" , name = "media3-session", version.ref = "media3"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

